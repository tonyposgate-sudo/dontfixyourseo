
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Don't Fix Your SEO</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://dontfixyourseo.com/">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root{
    --bg:#faf6f0; --ink:#1c1917; --ink-dim:#6b625a; --border:#e7dfd5;
    --accent:#c2410c; --accent-2:#0f766e; --accent-ink:#fff7ed;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1c1917; --ink:#f5f1ea; --ink-dim:#a89f96; --border:#3a332c; --accent:#ff6a3d; --accent-2:#5eead4; --accent-ink:#1a0e08; }
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    padding:24px; text-align:center;
  }
  .wordmark{font-family:'Arial Black',sans-serif;font-weight:900;font-size:18px;letter-spacing:.02em;color:var(--ink);margin-bottom:28px;}
  .wordmark .strike{text-decoration:line-through;text-decoration-color:var(--accent);text-decoration-thickness:3px;color:var(--ink-dim);}
  .code{font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:10px;}
  h1{font-size:26px;margin:0 0 12px;}
  p{font-size:15.5px;color:var(--ink-dim);max-width:44ch;margin:0 auto 28px;line-height:1.5;}
  .btn{
    display:inline-block;background:var(--accent);color:var(--accent-ink);text-decoration:none;
    font-weight:700;font-size:15px;padding:12px 22px;border-radius:10px;
  }
  .btn:hover{opacity:.92;}
</style>
</head>
<body>
  <div>
    <div class="wordmark">DON'T <span class="strike">FIX</span> YOUR SEO</div>
    <div class="code">404</div>
    <h1>That page doesn't exist.</h1>
    <p>The link you followed might be broken, or the page may have moved. Let's get you back to somewhere useful.</p>
    <a class="btn" href="/">Back to the homepage →</a>
  </div>
</body>
</html>
